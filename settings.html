<div class="et-settings-drawer">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Internal States</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="et-drawer-description">
                Runs the Internal States engine (DnD Simulator, Agendas, GM's Notebook, Inventory, Relationships, World Sim, Chekhov's Gun, Internal Thoughts) regardless of the active preset.
            </div>

            <div class="et-field">
                <label class="et-toggle-row" for="internal_states_enabled">
                    <input type="checkbox" id="internal_states_enabled" class="checkbox">
                    <span class="et-label-text">Enable Internal States window</span>
                </label>
                <div class="et-hint">Shows the Internal States panel. Module toggles are coming soon.</div>
            </div>

        </div>
    </div>
</div>
